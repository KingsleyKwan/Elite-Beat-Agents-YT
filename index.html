<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#ff4d6d" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="応援団YT" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <title>応援団 YT</title>
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <div id="rotate-hint">
    <div class="icon">📱↻</div>
    <div><strong>請橫放手機</strong></div>
  </div>


  <!-- Personal-use disclaimer (before home) -->
  <div id="disclaimer-gate" class="screen gate" hidden>
    <div class="card gate-card">
      <p class="disclaimer-text">作為個人學習、研究或同好交流測試，避免進行商業營利行為。</p>
      <div class="actions">
        <button class="btn btn-go" id="btn-disclaimer-ok" type="button">明白／開始</button>
      </div>
    </div>
  </div>

  <div id="a2hs-gate" class="screen gate" hidden>
    <div class="card gate-card">
      <h2>加到主畫面</h2>
      <p>全螢幕更好玩。</p>
      <div class="gate-platform" id="a2hs-ios" hidden>
        <p>Safari：分享 →「加到主畫面」</p>
      </div>
      <div class="gate-platform" id="a2hs-android" hidden>
        <p>Chrome：選單 →「加到主螢幕」</p>
      </div>
      <div class="gate-platform" id="a2hs-other">
        <p>瀏覽器選單 → 加到主畫面</p>
      </div>
      <div class="actions">
        <button class="btn" id="btn-a2hs-install" type="button" hidden>安裝</button>
        <button class="btn secondary" id="btn-a2hs-continue" type="button">繼續</button>
      </div>
    </div>
  </div>

  <div id="yt-bg" aria-hidden="true">
    <div id="yt-player"></div>
  </div>

  <div id="app">
    <!-- Minimal top chrome (hidden on home, shown after load) -->
    <header class="topbar" id="topbar" hidden>
      <button class="btn ghost btn-icon" id="btn-home-mini" type="button" title="返回">←</button>
      <select id="difficulty-select" class="diff-mini" aria-label="難度">
        <option value="easy">易</option>
        <option value="normal" selected>正常</option>
        <option value="hard">難</option>
      </select>
      <button class="btn" id="btn-play" type="button" disabled>Play</button>
      <button class="btn ghost btn-icon" id="btn-more" type="button" title="更多">⋯</button>
    </header>

    <!-- Hidden fields kept for JS compatibility -->
    <div id="hidden-fields" hidden>
      <input id="url-input" type="url" />
      <input id="bpm-input" type="number" value="120" />
      <input id="offset-input" type="number" value="0" />
      <select id="subdiv-select"><option value="1">1</option><option value="2" selected>2</option><option value="4">4</option></select>
      <input id="latency-input" type="range" min="0" max="200" step="5" value="40" />
      <span id="latency-val">40</span>
      <span id="auto-bpm-label">—</span>
      <span id="beat-hint"></span>
      <button id="btn-load" type="button"></button>
      <button id="btn-sample" type="button"></button>
      <button id="btn-share" type="button"></button>
      <button id="btn-regen" type="button"></button>
      <button id="btn-advanced" type="button"></button>
      <button id="btn-calibrate" type="button"></button>
      <button id="btn-local-helper" type="button"></button>
      <button id="btn-beat-tap" type="button"></button>
      <label id="btn-audio-label"><input id="audio-file" type="file" accept="audio/*,.mp3,.wav,.ogg,.m4a,.flac,video/*" /></label>
    </div>

    <div class="stage">
      <section class="play-pane">
        <canvas id="playfield"></canvas>
        <div class="hud" id="game-hud" hidden>
          <div class="life-row">
            <span class="life-label">LIFE</span>
            <div class="life-track"><div class="life-fill" id="life-fill"></div></div>
          </div>
          <div class="score-row">
            <span>SCORE <strong id="score-val">0</strong></span>
            <span>COMBO <strong id="combo-val">0</strong></span>
          </div>
        </div>
        <div class="judgment-flash" id="judgment-flash"></div>
        <div class="break-panel" id="break-panel"><div class="bubble" id="break-text">O！</div></div>

        <div class="beat-tap-overlay" id="beat-tap-overlay" hidden>
          <div class="beat-tap-card">
            <h3>跟拍</h3>
            <p id="beat-tap-msg">跟住拍子撳</p>
            <div class="beat-tap-count" id="beat-tap-count">0 / 8</div>
            <button class="btn btn-tap-pad" id="btn-tap-pad" type="button">撳！</button>
            <div class="actions">
              <button class="btn secondary" id="btn-beat-tap-done" type="button" disabled>完成</button>
              <button class="btn ghost" id="btn-beat-tap-cancel" type="button">取消</button>
            </div>
          </div>
        </div>

        <!-- HOME: only big URL + Paste + Go -->
        <div class="screen home-screen" id="ready-screen">
          <div class="home-card">
            <input
              id="home-url"
              class="home-url"
              type="url"
              inputmode="url"
              enterkeyhint="go"
              autocomplete="off"
              autocorrect="off"
              spellcheck="false"
              placeholder="YouTube 連結"
            />
            <div class="home-row">
              <button class="btn btn-paste" id="btn-paste" type="button">貼上</button>
              <button class="btn btn-go" id="btn-go" type="button">開始</button>
            </div>
          </div>
        </div>

        <!-- After load: compact ready-to-play -->
        <div class="screen" id="lobby-screen">
          <div class="lobby-card">
            <p class="lobby-title" id="ready-title">準備好</p>
            <p class="lobby-meta" id="ready-meta"></p>
            <select id="difficulty-select-lobby" class="diff-lobby" aria-label="難度">
              <option value="easy">易</option>
              <option value="normal" selected>正常</option>
              <option value="hard">難</option>
            </select>
            <button class="btn btn-go" id="btn-ready-play" type="button">Play</button>
          </div>
        </div>

        <div class="screen" id="result-screen">
          <div class="card">
            <h2 id="result-title">CLEAR！</h2>
            <p>分數 <strong id="stat-score">0</strong>　Combo <strong id="stat-combo">0</strong></p>
            <div class="stats">
              <div><strong id="stat-300">0</strong>300</div>
              <div><strong id="stat-100">0</strong>100</div>
              <div><strong id="stat-50">0</strong>50</div>
              <div><strong id="stat-0">0</strong>Miss</div>
            </div>
            <div class="actions">
              <button class="btn" id="btn-retry" type="button">再來</button>
              <button class="btn secondary" id="btn-result-share" type="button">分享</button>
              <button class="btn ghost" id="btn-home" type="button">主頁</button>
            </div>
          </div>
        </div>
      </section>
    </div>
  </div>

  <!-- ⋯ more sheet -->
  <div class="sheet" id="more-sheet" hidden>
    <div class="sheet-backdrop" id="more-backdrop"></div>
    <div class="sheet-panel">
      <h3>更多</h3>
      <label class="sheet-btn bb-upload">
        上傳音訊對拍
        <input id="audio-file-ready" type="file" accept="audio/*,.mp3,.wav,.ogg,.m4a,.flac,video/*" hidden />
      </label>
      <button class="sheet-btn" id="btn-beat-tap-ready" type="button">跟拍校准</button>
      <button class="sheet-btn" id="btn-more-sample" type="button">Sample</button>
      <button class="sheet-btn" id="btn-more-share" type="button">分享連結</button>
      <button class="sheet-btn" id="btn-more-regen" type="button">重新產譜</button>
      <button class="sheet-btn" id="btn-more-latency" type="button">觸控延遲校准</button>
      <button class="sheet-btn muted" id="more-close" type="button">關閉</button>
    </div>
  </div>

  <div class="screen" id="calibrate-screen">
    <div class="card">
      <h2>延遲校准</h2>
      <p id="calibrate-msg">跟閃光撳 4 次</p>
      <div id="calibrate-flash" class="cal-flash"></div>
      <div class="actions">
        <button class="btn" id="btn-cal-start" type="button">開始</button>
        <button class="btn ghost" id="btn-cal-cancel" type="button">取消</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="js/chart.js"></script>
  <script src="js/beatdetect.js"></script>
  <script src="js/yt.js"></script>
  <script src="js/game.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
